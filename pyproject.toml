[project]
name = "tha-utils-helper"
version = "0.2.5"
description = "A Tabular Helper utility library with general-purpose helpers, string normalization, numeric parsing, and date formatting for the tha-* ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["utilities", "helpers", "string", "numeric", "date", "rows", "csv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/tha-guy-nate/tha-utils-helper"
Issues = "https://github.com/tha-guy-nate/tha-utils-helper/issues"
Changelog = "https://github.com/tha-guy-nate/tha-utils-helper/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tha_utils_helper"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.deptry]
known_first_party = ["tha_utils_helper"]
optional_dependencies_dev_groups = ["dev"]

[tool.coverage.run]
source = ["src"]
